version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-bigcommerce
            source /usr/local/share/virtualenvs/tap-bigcommerce/bin/activate
            uv pip install .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-bigcommerce/bin/activate
            pylint tap_bigcommerce -d C,R,W
      - add_ssh_keys
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-bigcommerce/bin/activate
            uv pip install pytest coverage
            mkdir -p test_output
            coverage run -m pytest tests/unittests --junitxml=test_output/report.xml
            coverage report
            coverage html
      - store_test_results:
          path: test_output/report.xml
      - store_artifacts:
          path: htmlcov
      # ----------------------------------------------------------------
      # Integration Tests — controlled by USE_TAPTESTER env variable.
      #
      # Default (USE_TAPTESTER unset or "false"):
      #   Runs mocked integration tests (no API calls, no credentials).
      #   Tests live in tests/mock_integration/ and exercise real tap
      #   code with a mocked BigCommerce client.
      #
      # To enable tap-tester (real API):
      #   Set USE_TAPTESTER=true in the CircleCI project environment
      #   variables or in the "circleci-user" context.  This requires
      #   valid BigCommerce API credentials in the tap-tester sandbox.
      # ----------------------------------------------------------------
      - run:
          name: 'Integration Tests'
          command: |
            if [ "$USE_TAPTESTER" = "true" ]; then
              source /usr/local/share/virtualenvs/tap-tester/bin/activate
              uv pip install --upgrade awscli
              aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
              source dev_env.sh
              unset USE_STITCH_BACKEND
              run-test --tap=tap-bigcommerce tests
            else
              source /usr/local/share/virtualenvs/tap-bigcommerce/bin/activate
              uv pip install pytest
              python -m pytest tests/mock_integration/ -v
            fi
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
